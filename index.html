<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe3f7" />
    <title>畑スロット</title>
    <meta name="description" content="スロットを回して畑を育て、7日ごとの年貢を払い続けるゲーム。作物を3つ並べると高く売れる。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="畑スロット" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="畑スロット" />
    <meta property="og:description" content="回して、育てて、年貢を払え！スロットで畑を育てるゲーム" />
    <meta property="og:url" content="https://magis0619.github.io/Sixth/" />
    <meta property="og:image" content="https://magis0619.github.io/Sixth/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M32 58V36' stroke='%233f7a22' stroke-width='5' stroke-linecap='round'/><path d='M32 42Q16 40 14 26Q30 26 32 42Z' fill='%239bd56a' stroke='%233d3326' stroke-width='3'/><path d='M32 40Q48 38 50 24Q34 24 32 40Z' fill='%236fb03e' stroke='%233d3326' stroke-width='3'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Mochiy+Pop+One&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud-bar">
          <div class="hud-gold" id="gold-box"><span class="stat-icon"></span><span id="gold">0</span><span id="day" hidden></span></div>
          <button class="hud-tax" id="tax" aria-label="年貢" data-en-label="Tax"></button>
          <button class="icon-btn" id="menu-btn" aria-label="メニュー" data-en-label="Menu">≡</button>
        </div>
        <div class="hud-menu" id="hud-menu" hidden>
          <button id="help" data-en="？ How to play">？ 遊び方</button>
          <button id="mute">🔊 音</button>
          <button id="calm-btn">✨ 演出</button>
          <button id="settings-btn" data-en="⚙ Settings">⚙ 設定</button>
          <button id="to-title" data-en="🏠 Title&lt;small&gt;Your game is saved&lt;/small&gt;">🏠 タイトルへ<small>途中は保存されます</small></button>
        </div>
      </header>

      <div class="status" id="status" aria-live="polite"></div>

      <section class="scene" id="scene" aria-hidden="true">
        <div class="scene-sky"><i class="cloud c1"></i><i class="cloud c2"></i></div>
        <div class="scene-hill"></div>
        <div class="scene-hut" id="scene-hut"><i class="smoke s1"></i><i class="smoke s2"></i><i class="smoke s3"></i></div>
        <div class="scene-fence"></div>
        <div class="scene-critters" id="critters"></div>
      </section>

      <section class="farm" aria-label="畑" data-en-label="Field">
        <button class="order-tag" id="order" aria-label="注文" data-en-label="Order"></button>
        <div class="market-tag" id="market" aria-label="今週の相場" hidden></div>
        <div class="pick-tag" id="pick" aria-live="polite" hidden></div>
        <div class="field" id="field"></div>
      </section>

      <section class="machine" id="machine" aria-label="スロット" data-en-label="Slot machine">
        <div class="machine-top"></div>
        <div class="reels-frame">
          <div class="reels" id="reels"></div>
          <button class="spin-go" id="spin-go" hidden></button>
        </div>
        <div class="msg" id="msg" aria-live="polite"></div>
        <!-- 回すのはリールをタップ。このボタンは見えない（キーボード・読み上げ用） -->
        <button class="spin sr-only" id="spin" data-en="Spin">まわす</button>
      </section>

      <nav class="tabs" aria-label="メニュー" data-en-label="Menu">
        <button class="tab" data-sheet="shop"><span class="tab-ico" data-art="bargain"></span><span data-en="Shop">ショップ</span><span class="tab-note" id="goal"></span></button>
        <button class="tab" data-sheet="bag"><span class="tab-ico" data-art="seed"></span><span data-en="Bag">絵柄袋</span><span class="tab-note" id="bag-total"></span></button>
        <button class="tab" data-sheet="charms"><span class="tab-ico" data-art="coinPurse"></span><span data-en="Charms">お守り</span><span class="tab-note" id="charm-count"></span></button>
      </nav>
    </div>

    <div class="build-label" id="build-label"></div>

    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <aside class="sheet" id="sheet" aria-hidden="true">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="sheet-close" id="sheet-close" aria-label="閉じる" data-en-label="Close">×</button>
      </div>
      <div class="sheet-pane" data-pane="shop">
        <!-- 屋台：畑・絵柄を足す・お邪魔を消す を、1つの画面に見出しで分けて並べる -->
        <div class="stall" id="stall">
          <section class="stall-sec">
            <div class="awning"></div>
            <h3 class="stall-head"><span class="tab-ico" data-art="expand"></span><span data-en="Farm&lt;small&gt;3 picks this week · expand anytime&lt;/small&gt;">畑<small>今週の3品・広げるはいつでも</small></span></h3>
            <div class="shop" id="farm-shop"></div>
          </section>
          <section class="stall-sec">
            <div class="awning"></div>
            <h3 class="stall-head"><span class="tab-ico" data-art="seed"></span><span data-en="Add symbols&lt;small&gt;3 picks this week · makes them likelier&lt;/small&gt;">絵柄を足す<small>今週の3品・出やすくなる</small></span></h3>
            <div class="shop" id="shop"></div>
          </section>
          <section class="stall-sec">
            <div class="awning"></div>
            <h3 class="stall-head"><span class="tab-ico" data-art="crow"></span><span data-en="Remove pests&lt;small&gt;Once a week · pricier each time&lt;/small&gt;">お邪魔を消す<small>週1回・消すたび高くなる</small></span></h3>
            <div class="shop" id="remove-shop"></div>
            <p class="stall-empty" id="stall-empty" data-en="No pests in your bag!">袋にお邪魔はいない！</p>
          </section>
        </div>
      </div>
      <div class="sheet-pane" data-pane="bag">
        <p class="sheet-lead" data-en="Each reel draws one symbol from this bag. Odds shown">スロットはこの袋から1枚ずつ引く。出る確率つき</p>
        <div class="bag" id="bag"></div>
      </div>
      <div class="sheet-pane" data-pane="charms">
        <p class="sheet-lead" id="charm-panel" data-en="No charms yet. Pay a tax to pick one of three">まだお守りはない。年貢を納めると3つから1つ選べる</p>
        <div class="charms" id="charms"></div>
      </div>
    </aside>

    <div id="overlay"></div>
    <div id="fx" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
