<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eedb" />
    <title>畑スロット</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="stat stat-gold" id="gold-box"><span class="stat-icon">💰</span><span id="gold">0</span><small>金</small></div>
        <div class="stat stat-day"><span class="stat-icon">📅</span><span id="day">0</span><small>日目</small></div>
        <div class="tax" id="tax"></div>
        <button class="icon-btn" id="mute" aria-label="音のオン・オフ">🔊</button>
      </header>
      <div class="goal" id="goal"></div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="hint" id="hint" aria-live="polite"></div>

      <section class="machine" id="machine">
        <div class="machine-top">🌾 畑スロット 🌾</div>
        <div class="reels" id="reels"></div>
        <button class="spin" id="spin">まわす！</button>
        <div class="msg" id="msg" aria-live="polite"></div>
      </section>

      <section class="field-wrap">
        <div class="field" id="field"></div>
      </section>

      <section class="panel" id="charm-panel" hidden>
        <h2>🎁 お守り</h2>
        <div class="charms" id="charms"></div>
      </section>

      <section class="panel">
        <h2>🛠 スロットを強化</h2>
        <div class="shop" id="shop"></div>
      </section>

      <section class="panel">
        <h2>👜 絵柄袋 <small id="bag-total"></small></h2>
        <div class="bag" id="bag"></div>
      </section>
    </div>
    <div id="overlay"></div>
    <div id="fx" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
