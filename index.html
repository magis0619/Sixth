<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe3f7" />
    <title>畑スロット</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M32 58V36' stroke='%233f7a22' stroke-width='5' stroke-linecap='round'/><path d='M32 42Q16 40 14 26Q30 26 32 42Z' fill='%239bd56a' stroke='%233d3326' stroke-width='3'/><path d='M32 40Q48 38 50 24Q34 24 32 40Z' fill='%236fb03e' stroke='%233d3326' stroke-width='3'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- 手描き風の線：枠の線をわずかに揺らす（style.css の .sketch-line） -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="wobble">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" />
        <feDisplacementMap in="SourceGraphic" scale="3.2" />
      </filter>
    </svg>
    <div id="app">
      <header class="hud">
        <div class="hud-bar">
          <div class="hud-gold" id="gold-box"><span class="stat-icon"></span><span id="gold">0</span><span id="day" hidden></span></div>
          <button class="hud-tax" id="tax" aria-label="年貢"></button>
          <button class="icon-btn" id="menu-btn" aria-label="メニュー">≡</button>
        </div>
        <div class="hud-menu" id="hud-menu" hidden>
          <button id="help">？ 遊び方</button>
          <button id="mute">🔊 音</button>
          <button id="calm-btn">✨ 演出</button>
        </div>
      </header>

      <div class="status" id="status" aria-live="polite"></div>
      <div class="hint" id="hint" aria-live="polite"></div>

      <section class="scene" id="scene" aria-hidden="true">
        <div class="scene-sky"><i class="cloud c1"></i><i class="cloud c2"></i></div>
        <div class="scene-hill"></div>
        <div class="scene-hut" id="scene-hut"><i class="smoke s1"></i><i class="smoke s2"></i><i class="smoke s3"></i></div>
        <div class="scene-fence"></div>
        <div class="scene-critters" id="critters"></div>
      </section>

      <section class="farm" aria-label="畑">
        <button class="order-tag" id="order" aria-label="注文"></button>
        <div class="market-tag" id="market" aria-label="今週の相場" hidden></div>
        <div class="field" id="field"></div>
      </section>

      <section class="machine" id="machine" aria-label="スロット">
        <div class="machine-top"></div>
        <div class="reels-frame">
          <div class="reels" id="reels"></div>
          <button class="spin-go" id="spin-go" hidden></button>
        </div>
        <div class="msg" id="msg" aria-live="polite"></div>
        <!-- 回すのはリールをタップ。このボタンは見えない（キーボード・読み上げ用） -->
        <button class="spin sr-only" id="spin">まわす</button>
      </section>

      <nav class="tabs" aria-label="メニュー">
        <button class="tab" data-sheet="shop"><span class="tab-ico" data-art="bargain"></span>ショップ<span class="tab-note" id="goal"></span></button>
        <button class="tab" data-sheet="bag"><span class="tab-ico" data-art="seed"></span>絵柄袋<span class="tab-note" id="bag-total"></span></button>
        <button class="tab" data-sheet="charms"><span class="tab-ico" data-art="coinPurse"></span>お守り<span class="tab-note" id="charm-count"></span></button>
      </nav>
    </div>

    <div class="build-label" id="build-label"></div>

    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <aside class="sheet" id="sheet" aria-hidden="true">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="sheet-close" id="sheet-close" aria-label="閉じる">×</button>
      </div>
      <div class="sheet-pane" data-pane="shop">
        <!-- 屋台：左のタブで「畑・足す・消す」を切り替え、右に品を大きく並べる -->
        <div class="stall" id="stall" data-tab="farm">
          <nav class="stall-tabs" aria-label="ショップの種類">
            <button class="stall-tab" data-stall="farm"><span class="tab-ico" data-art="expand"></span>畑<span class="stall-dot"></span></button>
            <button class="stall-tab" data-stall="add"><span class="tab-ico" data-art="seed"></span>足す<span class="stall-dot"></span></button>
            <button class="stall-tab" data-stall="remove"><span class="tab-ico" data-art="crow"></span>消す<span class="stall-dot"></span></button>
          </nav>
          <div class="stall-pane">
            <div class="awning"></div>
            <p class="stall-lead" data-for="farm">今週の3品（年貢のあと入れ替わり）・置くマスは買ったあとタップ</p>
            <p class="stall-lead" data-for="add">今週の3品。足すとその絵柄が出やすくなる</p>
            <p class="stall-lead" data-for="remove">いつでも並ぶ。消せるのは週1回、消すたび高くなる</p>
            <div class="shop" id="farm-shop"></div>
            <div class="shop" id="shop"></div>
            <p class="stall-empty" id="stall-empty">袋にお邪魔はいない！</p>
          </div>
        </div>
      </div>
      <div class="sheet-pane" data-pane="bag">
        <p class="sheet-lead">スロットはこの袋から1枚ずつ引く。出る確率つき</p>
        <div class="bag" id="bag"></div>
      </div>
      <div class="sheet-pane" data-pane="charms">
        <p class="sheet-lead" id="charm-panel">まだお守りはない。年貢を納めると3つから1つ選べる</p>
        <div class="charms" id="charms"></div>
      </div>
    </aside>

    <div id="overlay"></div>
    <div id="fx" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
